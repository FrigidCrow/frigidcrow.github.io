<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123ce0">
    <title>隐私政策 | FrigidCrow</title>
    <meta name="description" content="FrigidCrow 个人作品集隐私说明。">
    <link rel="icon" href="/favicons/dark/favicon.ico">
    <link rel="stylesheet" href="/personal.css">
    <style>
      @font-face{font-family:NeueMontreal;src:url('/fonts/PPNeueMontreal-SemiBold.woff2') format('woff2');font-display:swap}
      :root{color-scheme:dark;background:#123ce0;color:#f4f1e9;font-family:NeueMontreal,Arial,sans-serif}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#123ce0}a{color:inherit}
      .shell{width:min(100% - 2rem,96rem);margin:auto;padding:1.25rem 0 4rem}
      header{display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;font-size:.78rem;letter-spacing:.04em}
      .brand{text-decoration:none;font-size:1rem}.back{text-underline-offset:.25rem}
      main{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;padding-top:16vh}
      h1{grid-column:1/-1;margin:0 0 10vh;font-size:clamp(4rem,12vw,12rem);font-weight:600;line-height:.8;letter-spacing:-.065em;text-transform:uppercase}
      .copy{grid-column:5/span 6;max-width:48rem;font-size:clamp(1.1rem,2vw,1.75rem);line-height:1.22}
      section{margin-bottom:3rem}h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 .9rem}p{margin:0 0 1rem}
      footer{display:flex;justify-content:space-between;margin-top:16vh;padding-top:1rem;border-top:1px solid rgba(244,241,233,.4);font-size:.75rem;text-transform:uppercase}
      @media(max-width:760px){main{padding-top:12vh}.copy{grid-column:1/-1}h1{margin-bottom:8vh}footer{gap:2rem;align-items:flex-end}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header><a class="brand" href="/">FrigidCrow</a><a class="back" href="/">返回作品集</a></header>
      <main>
        <h1>隐私<br>政策</h1>
        <div class="copy">
          <section><h2>概述</h2><p>这是一个托管在 GitHub Pages 上的个人作品集网站。本站不提供用户账户、不接受付款，也不会通过表单主动收集个人信息。</p></section>
          <section><h2>托管数据</h2><p>GitHub 在提供本站内容时，可能会处理 IP 地址、请求日志等技术信息。相关处理遵循 GitHub 自身的隐私条款。</p></section>
          <section><h2>外部链接</h2><p>访问 GitHub 或其他外部服务的链接后，将适用对应第三方网站的隐私规则。</p></section>
          <section><h2>联系</h2><p>如有疑问，可发送邮件至 <a href="mailto:172187433@qq.com">172187433@qq.com</a>。</p></section>
        </div>
      </main>
      <footer><span>FrigidCrow</span><span>最后更新：2026 年 7 月</span></footer>
    </div>
  </body>
</html>
